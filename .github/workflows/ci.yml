name: v6only-ci

on: [push, pull_request, workflow_dispatch]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: core/go.mod, cache-dependency-path: core/go.sum}
      - run: cd core && go test -race ./... && go vet ./...
      - name: Isolated network namespaces, real TUN TCP/UDP and failure recovery
        run: sudo -E env "PATH=$PATH" V6ONLY_DISPOSABLE_NETWORK=1 bash tests/tunnel-linux.sh

  syntax-and-logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: core/go.mod, cache-dependency-path: core/go.sum}

      - name: PowerShell 语法解析检查
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/windows/v6only.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "SYNTAX ERROR: $($_.Message) @ line $($_.Extent.StartLineNumber)" }
            exit 1
          }
          Write-Host "✓ 语法检查通过"

      - name: 函数级单元测试（不触网、不要求管理员的纯逻辑）
        shell: pwsh
        run: |
          # 点名加载脚本定义的函数（不执行主入口）
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/windows/v6only.ps1", [ref]$null, [ref]$null)
          # 验证关键函数存在
          $funcs = $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)
          $names = $funcs | ForEach-Object { $_.Name }
          foreach ($need in 'Test-CampusNetwork','Invoke-V6On','Invoke-V6Off','Write-Log','Invoke-Test') {
            if ($names -notcontains $need) { Write-Host "缺少函数: $need"; exit 1 }
          }
          Write-Host "✓ 关键函数齐全: $($names -join ', ')"

      - name: 校园边界与设置回滚回归测试（模拟系统 API）
        shell: pwsh
        run: ./windows/test.ps1
      - name: Disposable VM actual Wintun and failure recovery
        shell: pwsh
        run: ./windows/integration-test.ps1

      - name: 防火墙封堵逻辑等价性验证（真实 Windows 防火墙 API）
        shell: pwsh
        run: |
          # CI 的 windows-latest 以管理员跑，可真实操作 NetSecurity 模块
          # 等价复现 v6only 的封堵规则，验证 API 参数合法
          $blocked = @('8.8.8.8','8.8.4.4','1.1.1.1','9.9.9.9')
          try {
            New-NetFirewallRule -DisplayName 'ci-test-dns-block' -Direction Outbound `
              -Action Block -Protocol UDP -RemotePort 53 -RemoteAddress $blocked | Out-Null
            $rule = Get-NetFirewallRule -DisplayName 'ci-test-dns-block'
            if ($rule.Enabled -ne 'True') { throw "rule not enabled" }
            # 等价校验：v6only 实际只用 Enabled/Direction/Action，地址过滤单独查
            $addr = ($rule | Get-NetFirewallAddressFilter)
            if ($addr.RemoteAddress.Count -lt 1) { throw "remote address filter missing" }
            Write-Host "✓ 防火墙规则创建/查询成功 (RemoteAddress=$($addr.RemoteAddress -join ','))"
          } finally {
            Get-NetFirewallRule -DisplayName 'ci-test-dns-block' -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule
          }

      - name: 计划任务注册与停止验证（真实 ScheduledTasks 模块）
        shell: pwsh
        run: |
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/windows/v6only.ps1", [ref]$null, [ref]$null)
          $fn = $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $args[0].Name -eq 'Stop-V6Task' }, $false)
          . ([scriptblock]::Create($fn[0].Extent.Text))
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoProfile -Command Start-Sleep -Seconds 60"
          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(5)
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -RunLevel Highest
          try {
            Register-ScheduledTask -TaskName 'ci-test-task' -Action $action -Trigger $trigger -Principal $principal -Force | Out-Null
            Start-ScheduledTask -TaskName 'ci-test-task'
            for ($i = 0; $i -lt 20; $i++) {
              if ((Get-ScheduledTask 'ci-test-task').State -eq 'Running') { break }
              Start-Sleep -Milliseconds 250
            }
            if ((Get-ScheduledTask 'ci-test-task').State -ne 'Running') { throw 'Fixture did not start' }
            Stop-V6Task -TaskName 'ci-test-task'
            if ((Get-ScheduledTask 'ci-test-task').State -ne 'Disabled') { throw 'Task not stopped and disabled' }
            Write-Host '✓ Running scheduled task stopped before cleanup'
          } finally {
            Stop-ScheduledTask -TaskName 'ci-test-task' -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName 'ci-test-task' -Confirm:$false -ErrorAction SilentlyContinue
          }

      - name: DNS 配置 API 冒烟（真实 DnsClient 模块）
        shell: pwsh
        run: |
          # Hosted runners can have an Up adapter with IPv6 disabled. Select a
          # compatible adapter before exercising the IPv6 DNS API.
          $if = Get-NetAdapter | Where-Object Status -eq 'Up' | Where-Object {
            Get-DnsClientServerAddress -InterfaceIndex $_.ifIndex -AddressFamily IPv6 -ErrorAction SilentlyContinue
          } | Select-Object -First 1
          if ($if) {
            # 记录当前 → 设置测试值 → 校验 → 还原
            $before = Get-DnsClientServerAddress -InterfaceIndex $if.ifIndex -AddressFamily IPv6
            Set-DnsClientServerAddress -InterfaceIndex $if.ifIndex -ServerAddresses '2400:3200::1','202.112.128.50'
            $after = Get-DnsClientServerAddress -InterfaceIndex $if.ifIndex -AddressFamily IPv6
            if ($after.ServerAddresses -notcontains '2400:3200::1') { throw "DNS set failed" }
            Set-DnsClientServerAddress -InterfaceIndex $if.ifIndex -ResetServerAddresses
            Write-Host "✓ Set-DnsClientServerAddress 冒烟通过 ($($if.Name))"
          } else {
            Write-Host "⚠ CI 无启用 IPv6 DNS 的活动网卡，跳过 IPv6 DNS API 冒烟（其余测试继续）"
          }
      - name: Package Windows x64 distribution
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: v6only-windows
          path: build/release/*.zip

  macos-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck macOS 脚本
        run: |
          sudo apt-get install -y shellcheck
          for f in macos/*.sh; do
            echo "== $f"; shellcheck -S warning "$f" || exit 1
          done
      - name: macOS 控制器回归测试（模拟系统命令，不修改 runner 网络）
        run: python3 -m unittest discover -s tests -v

  macos-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: core/go.mod, cache-dependency-path: core/go.sum}
      - name: 系统 Bash 兼容性和回归测试
        run: |
          for f in macos/*.sh; do /bin/bash -n "$f"; done
          python3 -m unittest discover -s tests -v
      - name: PF 规则解析（仅检查，不加载）
        run: sudo pfctl -n -a com.apple/v6only -f macos/anchor-v6only
      - name: Build integration tools without root-owned module caches
        run: cd core && go build -o build/integration/ ./cmd/v6core ./cmd/netfixture ./cmd/netcheck
      - name: Disposable VM actual utun, dual-stack and exit recovery
        run: sudo -E env "PATH=$PATH" bash tests/tunnel-macos.sh
      - name: Package macOS universal distribution
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: v6only-macos
          path: build/release/*.zip

  android-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: core/go.mod, cache-dependency-path: core/go.sum}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build and verify Android APK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.13846066'
          bash android/build-apk.sh
      - name: Campus detection and mode regression tests
        run: bash android/test.sh
      - name: Release APK must not contain test-only VPN service
        run: |
          source android/sdk-env.sh
          "$BT/aapt2" dump xmltree android/v6only.apk --file AndroidManifest.xml > /tmp/manifest.txt
          if grep -Eq 'FixtureVpn|HandoverVpn|OtherVpn' /tmp/manifest.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: v6only-apk
          path: android/v6only.apk

  android-cellular:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: core/go.mod, cache-dependency-path: core/go.sum}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android build tools and enable emulator KVM
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.13846066' 'platforms;android-35' 'build-tools;35.0.0'
          sudo chmod 666 /dev/kvm
      - name: Real mobile startup, VPN coexistence and campus Wi-Fi handover
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            export V6ONLY_ANDROID_ABIS=x86_64
            export ANDROID_PLATFORM_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
            export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
            for suite in cellular other-vpn handover network; do V6ONLY_TEST_SUITE=$suite bash android/device-test.sh || exit 1; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-cellular-api-${{ matrix.api }}
          path: android/build/device-tests/result.txt
